services:
  - type: web
    name: mb230-api
    runtime: python
    plan: free
    branch: backend
    buildCommand: bash build.sh
    startCommand: >-
      python manage.py migrate &&
      python manage.py import_dataset &&
      python manage.py import_translations &&
      uvicorn config.asgi:application --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://mb230.joaue68957.workers.dev"]'
      - key: DATABASE_URL
        sync: false
